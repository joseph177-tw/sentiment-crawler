# 社群輿情爬蟲：每週彙整
name: Weekly Sentiment Report

on:
  schedule:
    - cron: '0 23 * * 0'   # 每週日台灣時間早上7點 (UTC+8, -8hr)
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Aggregate weekly trend and render report
        run: |
          python pipeline/aggregate.py --weekly
          python report/render.py --weekly

      - name: Commit report
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ report/output/ docs/
          git commit -m "weekly report $(TZ='Asia/Taipei' date +%F)" || echo "no changes"
          git push

      - name: Notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify/telegram_bot.py --weekly
