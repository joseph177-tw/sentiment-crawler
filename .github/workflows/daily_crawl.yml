# 社群輿情爬蟲：每日排程
name: Daily Sentiment Crawl

on:
  schedule:
    - cron: '0 23 * * *'   # 每日台灣時間早上7點 (UTC+8, -8hr)
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Run crawlers
        # dcard_crawler.py / forum_crawler.py 暫停排程：Dcard 是 Cloudflare 挑戰頁擋下
        # （headless Chromium 也一樣被 429），Mobile01 是 Akamai 對整個 IP 段直接回
        # 403 Access Denied（連 RSS 路徑都一樣，不是單一頁面規則）。細節見 README。
        # 程式碼保留，之後想到別的繞法可以直接接回來這裡。
        run: |
          python crawlers/news_crawler.py
          python crawlers/ptt_crawler.py

      - name: Clean and analyze
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python pipeline/clean.py
          python pipeline/sentiment.py

      - name: Persist to SQLite and render report
        run: |
          python pipeline/aggregate.py
          python pipeline/aggregate.py --keywords
          python pipeline/stock_detect.py
          python report/render.py
          python report/render.py --keywords
          python report/render.py --market

      - name: Commit data
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ report/output/ docs/
          git commit -m "daily crawl $(TZ='Asia/Taipei' date +%F)" || echo "no changes"
          git push

      - name: Notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify/telegram_bot.py
