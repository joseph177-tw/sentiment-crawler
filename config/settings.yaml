# 各爬蟲/pipeline 共用參數。異動排程頻率、來源範圍時只改這裡，不動程式碼。

timezone: "Asia/Taipei"

ptt:
  boards: ["Stock", "Bank_Service"]
  max_pages_per_board: 5      # 每次執行往回翻的頁數上限
  request_delay_seconds: [1, 2]   # 每則請求間隔區間（秒），隨機取值

dcard:
  forums: ["stock", "money"]
  max_pages_per_forum: 3
  request_delay_seconds: [2, 3]

news:
  sources:
    - name: "經濟日報"
      rss: "https://money.udn.com/rssfeed/news/1001/5590/5591?ch=money"
    - name: "工商時報"
      rss: "https://www.ctee.com.tw/rss"
    - name: "鉅亨網"
      rss: "https://news.cnyes.com/rss/cat/tw_stock"
    - name: "Yahoo奇摩財經"
      rss: "https://tw.stock.yahoo.com/rss?category=news"
    - name: "MoneyDJ"
      rss: "https://www.moneydj.com/kmdj/rss/rssfinancenews.xml"
  max_items_per_source: 30

forum:
  mobile01:
    board_url: "https://www.mobile01.com/topiclist.php?f=291"
  request_delay_seconds: [2, 3]

clean:
  min_content_length: 15   # 低於此字數的留言視為無效，過濾掉

sentiment:
  batch_size: 10            # 每次打包送入 LLM 的貼文數量
  model: "claude-haiku-4-5-20251001"
  max_retries: 2

report:
  top_topics: 10
  # GitHub Pages 固定網址（來源 docs/index.html、docs/weekly.html，每次排程覆蓋更新）
  # 留空字串則 notify/telegram_bot.py 會退回附加 HTML 檔案的方式推播
  pages_base_url: "https://joseph177-tw.github.io/sentiment-crawler"

market:
  # 只收錄「至少被提及 min_mention_count 次」的個股，濾掉單一貼文偶發提到、
  # 沒有實際討論度的雜訊（例如某篇文章隨口列了一堆代號）。用累積 1012 則貼文
  # 實測過：min_count=1（提過一次就算）會炸出 194 檔，逼近下面的安全上限，
  # 且每日 Yahoo Finance 請求量、執行時間都會大幅增加；拉高到 3 才是比較
  # 反映「真的有人在討論」的個股。想收更廣就調低這個數字，但要有心理準備
  # 檔數、每日執行時間都會跟著漲。
  min_mention_count: 3

  # 盤勢總覽的「近期熱門」榜單只算最近這幾天的提及次數（跟上面 min_mention_count
  # 用的「全部歷史累積」是兩個獨立指標）。背景：累積榜單跑久了會卡死在早期
  # 衝上去的個股，就算後來完全沒人討論、排名還是紋風不動（2026-09-24 實測：
  # 一週前後前20名有18檔完全相同，其中12檔提及次數一次都沒增加）。加一個
  # 近期榜單讓使用者能看到「最近真的在討論什麼」，累積榜單保留給想看「開站
  # 以來整體討論度」的情境。30天是常見的「近期熱度」窗口長度，可依討論量
  # 疏密調整。
  recent_window_days: 30

  # 盤勢頁面最多顯示幾檔個股，是防暴走的安全上限，不是常態會用到的裁切線。
  # 如果哪天檔數逼近這個上限，代表 Yahoo Finance 每日請求量也會跟著大幅
  # 增加，那時候要重新評估（分批更新／調整 request_delay_seconds／拉高
  # min_mention_count），不要單純調高數字了事。
  top_n: 200

  price_range: "6mo"  # Yahoo Finance 歷史區間（market.html 總覽用的單一區間）
  # 個股詳細頁（docs/stocks/<code>.html）獨立抓取的分頁區間（當日/五日/五年，
  # 資料密度跟日線差太多，各自抓）。近月/三月/六月/一年這四個分頁改成從
  # indicator_range 抓的單一日線基礎資料尾端切片，見下方 indicator_range 與
  # indicator_tab_days —— 這樣技術指標（MA/RSI/...）才能跟價格圖用同一份資料，
  # 日期不會對不齊，也少打好幾次 Yahoo API。
  detail_ranges:
    - {label: "當日", range: "1d", interval: "5m"}
    - {label: "五日", range: "5d", interval: "15m"}
    - {label: "五年", range: "5y", interval: "1wk"}
  indicator_range: "2y"   # 技術指標基礎日線資料區間，需要夠長才能算 MA240 這類長週期指標
  indicator_tab_days:      # 從 indicator_range 尾端切幾天出來對應分頁籤
    近月: 22
    三月: 65
    六月: 126
    一年: 252
  institutional_days: 20   # 三大法人買賣超近期趨勢要抓幾個交易日
  institutional_lookback_days: 45  # 往回試探幾個「日曆日」去湊滿 institutional_days 個交易日（跳過假日/非交易日）
  # 個股詳細頁多區間/多日期抓取，每次請求間隔。2026-09-15 實測過 Yahoo Finance
  # 真的會限流（連續打幾次就 429，不是長期封鎖，但間隔太短會一直被擋），原本
  # 0.3-0.6 秒太積極，拉高到 1.5-2.5 秒降低單日排程觸發限流的機率。
  request_delay_seconds: [1.5, 2.5]

data:
  raw_dir: "data/raw"
  db_path: "data/db.sqlite"
