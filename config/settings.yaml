# 各爬蟲/pipeline 共用參數。異動排程頻率、來源範圍時只改這裡，不動程式碼。

timezone: "Asia/Taipei"

ptt:
  boards: ["Stock", "Bank_Service"]
  max_pages_per_board: 5      # 每次執行往回翻的頁數上限
  request_delay_seconds: [1, 2]   # 每則請求間隔區間（秒），隨機取值

dcard:
  forums: ["stock", "money"]
  max_pages_per_forum: 3
  request_delay_seconds: [2, 3]

news:
  sources:
    - name: "經濟日報"
      rss: "https://money.udn.com/rssfeed/news/1001/5590/5591?ch=money"
    - name: "工商時報"
      rss: "https://www.ctee.com.tw/rss"
    - name: "鉅亨網"
      rss: "https://news.cnyes.com/rss/cat/tw_stock"
    - name: "Yahoo奇摩財經"
      rss: "https://tw.stock.yahoo.com/rss?category=news"
    - name: "MoneyDJ"
      rss: "https://www.moneydj.com/kmdj/rss/rssfinancenews.xml"
  max_items_per_source: 30

forum:
  mobile01:
    board_url: "https://www.mobile01.com/topiclist.php?f=291"
  request_delay_seconds: [2, 3]

clean:
  min_content_length: 15   # 低於此字數的留言視為無效，過濾掉

sentiment:
  batch_size: 10            # 每次打包送入 LLM 的貼文數量
  model: "claude-haiku-4-5-20251001"
  max_retries: 2

report:
  top_topics: 10
  # GitHub Pages 固定網址（來源 docs/index.html、docs/weekly.html，每次排程覆蓋更新）
  # 留空字串則 notify/telegram_bot.py 會退回附加 HTML 檔案的方式推播
  pages_base_url: "https://joseph177-tw.github.io/sentiment-crawler"

market:
  top_n: 15          # 盤勢頁面最多顯示幾檔個股（依提及次數排序）
  price_range: "6mo"  # Yahoo Finance 歷史區間（market.html 總覽用的單一區間）
  # 個股詳細頁（docs/stocks/<code>.html）的分頁區間，對應畫面上的分頁籤
  # key 是分頁顯示文字，range/interval 是 Yahoo Finance chart API 參數
  detail_ranges:
    - {label: "當日", range: "1d", interval: "5m"}
    - {label: "五日", range: "5d", interval: "15m"}
    - {label: "近月", range: "1mo", interval: "1d"}
    - {label: "三月", range: "3mo", interval: "1d"}
    - {label: "六月", range: "6mo", interval: "1d"}
    - {label: "一年", range: "1y", interval: "1d"}
    - {label: "五年", range: "5y", interval: "1wk"}
  request_delay_seconds: [0.3, 0.6]  # 個股詳細頁多區間抓取，每次 Yahoo 請求間隔

perplexity:
  # 留空則 pipeline/perplexity_search.py 直接跳過，不影響其他功能
  enabled: true
  model: "sonar"
  cache_days: 7   # 同一檔個股幾天內不重複查詢（控制 API 成本）

data:
  raw_dir: "data/raw"
  db_path: "data/db.sqlite"
